<style>
:root {

* { margin:0; padding:0; box-sizing:border-box; }

/* ---------- 封面 ---------- */

.hero h1 em { font-style:normal; background:linear-gradient(transparent 58%, rgba(206,164,82,.5) 58%); padding:0 .12em; }

.hero-art img { display:block; width:100%; height:100%; object-fit:cover; }

/* ---------- 選圖 ---------- */
.pick-head { text-align:center; padding:26px 26px 0; }
.pick-head h2 { font-family:var(--serif); font-size:20px; font-weight:900; letter-spacing:.04em; }

.grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; padding:18px 22px 10px; }

.pc { all:unset; box-sizing:border-box; display:block; cursor:pointer; text-align:center; background:var(--card); border:1.5px solid var(--line); border-radius:20px; padding:10px 10px 12px; box-shadow:var(--shadow);
  transition:transform var(--ease), box-shadow var(--ease), opacity .3s, border-color .3s; -webkit-tap-highlight-color:transparent; }
.pc:focus-visible { outline:3px solid var(--gold); outline-offset:3px; }
.pc:hover { transform:translateY(-4px); }
.pc-letter { display:block; font-family:var(--serif); font-weight:900; font-size:28px; line-height:1; margin:2px 0 8px; }
.pc-img { display:block; width:100%; height:auto; aspect-ratio:206/332; object-fit:cover; border-radius:14px; }
.pc-label { display:block; margin-top:10px; font-size:13px; font-weight:700; line-height:1.5; min-height:2.9em; }
.grid.has-pick .pc { opacity:.5; transform:scale(.97); }
.grid.has-pick .pc.sel { opacity:1; transform:translateY(-4px); border-color:var(--gold); box-shadow:0 0 0 3px rgba(184,136,58,.38), var(--shadow); }

.calc { padding:70px 28px 80px; text-align:center; }

var picked = null;
var grid = document.getElementById('grid');
var res = document.getElementById('res');

function ev(name, params){ if (typeof gtag === 'function') gtag('event', name, params || {}); }
function labelOf(k){ for (var i = 0; i < D.opts.length; i++){ if (D.opts[i].k === k) return D.opts[i].label; } return ''; }

/* 組四張選項卡 */
D.opts.forEach(function(o){
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'pc';
  b.setAttribute('data-k', o.k);
  b.setAttribute('aria-pressed', 'false');
  b.innerHTML = '<span class="pc-letter">' + o.k + '</span>' +
    '<img class="pc-img" src="' + o.img + '" alt="' + o.label + '" width="206" height="332">' +
    '<span class="pc-label">' + o.label + '</span>';
  b.onclick = function(){ choose(o.k, true); };
  grid.appendChild(b);
});

function mark(k){
  grid.classList.toggle('has-pick', !!k);
  Array.prototype.forEach.call(grid.children, function(c){
    var on = c.getAttribute('data-k') === k;
    c.classList.toggle('sel', on);
    c.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}

function choose(k, animate){
  if (picked === null) ev('quiz_start', {});
  picked = k;
  mark(k);
  ev('quiz_answer', { quiz_step: 1, option_letter: k });
  res.className = 'on';
  if (animate){
    res.innerHTML = '<div class="calc"><div class="ring"></div><div class="calc-t">正在對照你選的那一張</div></div>';
    setTimeout(function(){ res.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60);
    setTimeout(function(){ if (picked === k) draw(k); }, 750);
  } else {
    draw(k);
  }
}

function blk(h, t){ return '<div class="blk"><h4>' + h + '</h4><p>' + t + '</p></div>'; }

function draw(k){
  var T = D.types[k];
  var G = T.gem;
  var bridge = D.bridge.map(function(b){ return '<p' + (b.em ? ' class="em"' : '') + '>' + b.text + '</p>'; }).join('');
  var others = Object.keys(D.types).filter(function(x){ return x !== k; }).map(function(x){
    var O = D.types[x];
    return '<div class="oth" data-k="' + x + '">' +
      '<div class="oth-head" data-act="oth"><span class="oth-letter">' + x + '</span>' + labelOf(x) + '<span class="oth-arrow">⌄</span></div>' +
      '<div class="oth-body">' + blk('把自己看成', O.reveal) + blk('你其實需要聽到的', O.b5) + '</div></div>';
  }).join('');

  res.innerHTML =
    '<div class="orn">✦</div>' +
    '<div class="res-head">' +
      '<div class="res-kicker">YOUR RESULT</div>' +
      '<div class="res-title"><span>你內心深處最害怕失去的是</span>' + labelOf(k) + '</div>' +
      '<div class="res-reveal">你現在把自己看成<b>' + T.reveal + '</b></div>' +
    '</div>' +
    '<div class="res-quote">' + T.quote + '</div>' +
    '<div class="card">' +
      blk('你心裡常出現的那句話', T.b1) +
      blk('你為什麼會選這一張', T.b2) +
      blk('你可能誤會的', T.b4) +
      blk('你其實需要聽到的', T.b5) +
    '</div>' +
    '<div class="gem">' +
      '<div class="gem-label">FOREST CRYSTAL · 森靈水晶</div>' +
      '<div class="gem-intro">' + D.gem_intro + '</div>' +
      '<div class="gem-bridge">' + T.bridge + '</div>' +
      '<div class="gem-card">' +
        '<div class="gem-head">' +
          '<a class="gem-img-link" href="' + G.url + '" target="_blank" rel="noopener"><img class="gem-img" src="' + G.img + '" alt="' + G.alt + '" width="800" height="800"></a>' +
          '<div class="gem-txt"><div class="gem-name">' + G.name + '</div><div class="gem-stones">' + G.stones + '</div></div>' +
        '</div>' +
        '<div class="gem-why">' + G.why + '</div>' +
        '<a class="btn" href="' + G.url + '" target="_blank" rel="noopener" data-act="gem">看看這一款 →</a>' +
      '</div>' +
      '<div class="code"><div class="code-t">使用專屬折扣碼「<b>Karen</b>」可折 $100</div><button class="code-btn" type="button" data-act="copy">複製</button></div>' +
      '<div class="more"><a href="' + G.moreUrl + '" target="_blank" rel="noopener">' + G.moreLabel + ' →</a></div>' +
    '</div>' +
    '<div class="others"><h3>另外三張圖，你身邊一定有人是</h3><div class="sub">點開看看，也許你會想到某一個人</div>' + others + '</div>' +
    '<div class="bridge-card">' + bridge + '</div>' +
    '<div class="cta">' +
      '<div class="cta-line">' + D.cta.line + '</div>' +
      '<div class="cta-sub">' + D.cta.sub + '</div>' +
      '<a class="btn big" href="' + D.cta.url + '" target="_blank" rel="noopener" data-act="cta">' + D.cta.btn + '</a>' +
      '<div class="cta-note">' + D.cta.note + '</div>' +
    '</div>' +
    '<div class="retake"><span data-act="retake">重選一張圖</span></div>' +
    '<div class="disclaimer">本測驗為娛樂與自我探索用途，不代表任何醫療或心理診斷</div>';

  try { history.replaceState(null, '', '#r=' + k); } catch (e) {}
  ev('quiz_complete', { result_type: k });
}

/* 結果區的點擊：用事件代理，因為內容每次都會重繪 */
res.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]');
  if (!t) return;
  var act = t.getAttribute('data-act');
  if (act === 'copy') copyCode(t);
  else if (act === 'oth'){
    var box = t.parentNode;
    box.classList.toggle('open');
    if (box.classList.contains('open')) ev('quiz_other_open', { option_letter: box.getAttribute('data-k') });
  }
  else if (act === 'retake') retake();
});

function retake(){
  picked = null;
  mark(null);
  res.className = '';
  res.innerHTML = '';
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  window.scrollTo({ top: Math.max(0, grid.offsetTop - 90), behavior: 'smooth' });
}

function copyCode(btn){
  ev('code_copy', { partner: 'forest_crystal', code_value: 'Karen', result_type: picked || '' });
  var done = function(){
    btn.textContent = '已複製'; btn.classList.add('done');
    setTimeout(function(){ btn.textContent = '複製'; btn.classList.remove('done'); }, 1600);
  };
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText('Karen').then(done).catch(function(){ fallbackCopy(done); });
  } else { fallbackCopy(done); }
}
function fallbackCopy(done){
  var ta = document.createElement('textarea');
  ta.value = 'Karen'; ta.style.cssText = 'position:fixed;top:-9999px';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  document.body.removeChild(ta);
}

/* 分享連結（#r=A~D）直接進結果 */
(function(){
  var m = location.hash.match(/r=([A-D])/);
  if (m){
    choose(m[1], false);
    setTimeout(function(){ res.scrollIntoView({ block: 'start' }); }, 120);
  }
})();
</script>
